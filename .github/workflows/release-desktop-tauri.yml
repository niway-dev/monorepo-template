name: Release Desktop (Tauri)

# Builds the Tauri app for macOS (Apple Silicon + Intel), signs it with a
# Developer ID, notarizes it, and attaches the DMGs plus the updater artifacts
# (signed .app.tar.gz and latest.json) to a draft GitHub Release.
#
# Trigger: push a `desktop-tauri-v*` tag (e.g. `desktop-tauri-v0.1.0`), or run it
# manually from the Actions tab while tuning the pipeline. The tag is
# component-prefixed so the app versions independently of everything else.
#
# ---------------------------------------------------------------------------
# Secrets — store these in a GitHub Environment named `production`. The Apple
# ones are the same secrets the Electron release uses:
#   CSC_LINK                             base64 of the Developer ID .p12
#   CSC_KEY_PASSWORD                     the password set when the .p12 was exported
#   APPLE_API_KEY                        base64 (or raw contents) of the App Store Connect .p8
#   APPLE_API_KEY_ID                     the key id (10 characters)
#   APPLE_API_ISSUER                     the Issuer ID (a UUID)
#   TAURI_SIGNING_PRIVATE_KEY            updater signing key, from `bun run tauri signer generate`
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   its password
#
# Until those secrets exist this workflow fails, which is the intended
# behaviour: releasing an unsigned desktop app is worse than not releasing one.
#
# Auto-update: the app reads `plugins.updater.endpoints` in tauri.conf.json. Point
# it at https://github.com/<owner>/<repo>/releases/latest/download/latest.json —
# this workflow uploads latest.json to the release — and updates reach users once
# the release is published (not draft, not prerelease).
# ---------------------------------------------------------------------------

on:
  push:
    tags:
      - "desktop-tauri-v*.*.*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # create the GitHub Release and upload assets

jobs:
  release-mac:
    name: Build, sign & notarize (${{ matrix.target }})
    runs-on: macos-latest
    timeout-minutes: 60
    environment: production # the signing secrets live in this Environment
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check the tag matches the app version
        # A `desktop-tauri-v0.2.0` tag must not ship 0.1.0 binaries and update
        # metadata. The version lives in tauri.conf.json.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APP_VERSION="$(node -p "require('./apps/desktop-tauri/src-tauri/tauri.conf.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#desktop-tauri-v}"
          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $APP_VERSION"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Apple API key file
        # Tauri's notarizer wants the .p8 as a file path. Accepts either the raw
        # .p8 contents or its base64, whichever the secret holds.
        env:
          APPLE_API_KEY_SECRET: ${{ secrets.APPLE_API_KEY }}
        run: |
          KEY_PATH="$RUNNER_TEMP/apple_api_key.p8"
          if printf '%s' "$APPLE_API_KEY_SECRET" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s' "$APPLE_API_KEY_SECRET" > "$KEY_PATH"
          else
            printf '%s' "$APPLE_API_KEY_SECRET" | base64 --decode > "$KEY_PATH"
          fi
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build, sign, notarize & release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri's names differ from electron-builder's; the values are the same.
          APPLE_CERTIFICATE: ${{ secrets.CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }} # Tauri calls the key *id* APPLE_API_KEY
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # APPLE_API_KEY_PATH comes from GITHUB_ENV (previous step).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop-tauri
          tauriScript: bun run tauri
          # Updater artifacts are off in tauri.conf.json so a local `bundle` works
          # without the signing key; releases always produce them.
          args: --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
          # Tag pushes create (or reuse) the release; a manual dispatch has no tag
          # and only uploads the build as a workflow artifact.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Desktop (Tauri) ${{ github.ref_name }}"
          # Draft, so a human writes the notes before it reaches testers.
          releaseDraft: true
          prerelease: true
          uploadUpdaterJson: true
          uploadWorkflowArtifacts: ${{ !startsWith(github.ref, 'refs/tags/') }}

# ---------------------------------------------------------------------------
# Windows and Linux are NOT built here, for the same reason as the Electron
# release: their signing story is not validated in this template. tauri-action
# builds both from the same step — add `windows-latest` / `ubuntu-22.04` runners
# to a matrix keyed on the OS, install the Linux webview packages on Ubuntu (see
# ci-desktop-tauri.yml), and add the Windows signing configuration
# (bundle.windows.certificateThumbprint or a custom sign command).
# ---------------------------------------------------------------------------
