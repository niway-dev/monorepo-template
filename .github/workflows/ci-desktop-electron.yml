name: Desktop CI (Electron)

# Tier: candidate on demand (docs/adr/0003-desktop-ci-pipelines.md).
#
# Not triggered by pull requests. The Lefthook pre-push runs `bun run verify` locally
# (~3 s warm) and release-desktop-electron.yml runs the same `verify` on the tagged SHA
# before anything is signed or published. Run this from the Actions tab to rehearse a
# release in a clean environment — e.g. after a risky change: the lockfile, workflows,
# scripts/, or the app's build config.
#
# Cost: one Linux job, ~1 min with warm caches. Before ADR 0003 it ran on every PR that
# touched packages/** and spent ~2 min of each run downloading Electron from a
# `postinstall` it did not need.
#
# Reopen (back to pull_request, path-filtered to apps/desktop-electron/**) when a second
# person merges to main, or when a release gate catches something the pre-push missed.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      # Keyed on inputs, never on github.sha: entries are immutable, so a per-SHA key
      # mints a new entry on every run and fills the 10 GB budget.
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache turbo outputs
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # No lifecycle scripts run here: tests and the electron-vite build need no
      # Electron binary, so none is downloaded.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The workspace packages this app uses (domain, application, i18n, tokens)
      # resolve from source, so no package build step is needed first.
      - name: Test
        working-directory: apps/desktop-electron
        run: bun run test

      # `build` runs the type-check first, then electron-vite. It is the real check
      # that the workspace packages bundle into the main process — a type-check
      # alone would not catch that.
      - name: Build
        working-directory: apps/desktop-electron
        run: bun run build
