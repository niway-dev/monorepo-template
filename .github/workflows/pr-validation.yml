name: PR Validation

# Tier: on demand only (docs/adr/0003-desktop-ci-pipelines.md; hub:
# monorepos/release-gated-verification.md). Not triggered by pull requests: with a single
# owner and no branch protection a PR check is advisory — it bills every push and verifies
# nothing the Lefthook pre-push (`bun run verify`: lint, format, package builds, types,
# tests) has not already verified for free. Release workflows run the same `verify` on the
# tagged SHA before publishing. Dispatch this from the Actions tab after a risky change
# (lockfile, workflows, scripts/, build config) to rehearse it in a clean environment.
#
# Reopen (back to pull_request) when a second person merges to main, or branch protection
# makes the check required — then it is a guarantee instead of a notification.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      # Keyed on inputs, never on github.sha: cache entries are immutable, so a per-SHA
      # key mints a new entry on every push. cache-cleanup.yml deletes a PR's entries
      # when it closes.
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache turbo outputs
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bunx oxfmt --check .

      - name: Build packages
        run: bun run build --filter='@monorepo-template/*'

      - name: Type check
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: Build server-elysia
        working-directory: apps/server-elysia
        run: bun run build

      - name: Build server-hono
        working-directory: apps/server-hono
        run: bun run build

      - name: Build web-elysia
        working-directory: apps/web-elysia
        env:
          VITE_SERVER_URL: https://placeholder.example.com
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          BETTER_AUTH_SECRET: placeholder-secret-for-build-validation
        run: bun run build

      - name: Build web-hono
        working-directory: apps/web-hono
        env:
          VITE_SERVER_URL: https://placeholder.example.com
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          BETTER_AUTH_SECRET: placeholder-secret-for-build-validation
        run: bun run build

      - name: Build fullstack-fn-only
        working-directory: apps/fullstack-fn-only
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          BETTER_AUTH_SECRET: placeholder-secret-for-build-validation
        run: bun run build

      - name: Build fullstack-fn-and-convex
        working-directory: apps/fullstack-fn-and-convex
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          BETTER_AUTH_SECRET: placeholder-secret-for-build-validation
          BETTER_AUTH_URL: http://localhost:3004
          JWT_PRIVATE_JWK: '{"kty":"RSA","n":"placeholder","e":"AQAB","kid":"placeholder","alg":"RS256","use":"sig"}'
          JWT_KID: placeholder-kid
          VITE_CONVEX_URL: https://placeholder.convex.cloud
        run: bun run build

      - name: Build documentation
        working-directory: apps/documentation
        run: bun run build
