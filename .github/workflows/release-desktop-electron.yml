name: Release Desktop (Electron)

# Builds the macOS desktop app (arm64 + x64), signs it with a Developer ID,
# notarizes it, and attaches the DMGs to a GitHub Release.
#
# Trigger: push a `desktop-electron-v*` tag (e.g. `desktop-electron-v0.1.0`), or run it manually
# from the Actions tab while tuning the pipeline. The tag is component-prefixed
# so the desktop app can version independently of the web and API apps.
#
# Tier: release (docs/adr/0003-desktop-ci-pipelines.md). A Linux `verify` job gates the
# macOS job with `needs:`; the tag must match apps/desktop-electron/package.json. This is
# where the cloud validates the code that ships — desktop CI no longer runs per PR.
#
# ---------------------------------------------------------------------------
# Secrets — store these in a GitHub Environment named `production` (hence the
# `environment:` key below):
#   CSC_LINK          base64 of the Developer ID .p12 (electron-builder accepts base64)
#   CSC_KEY_PASSWORD  the password set when the .p12 was exported
#   APPLE_API_KEY     base64 of the App Store Connect .p8 (decoded to a temp file below)
#   APPLE_API_KEY_ID  the key id (10 characters)
#   APPLE_API_ISSUER  the Issuer ID (a UUID)
#
# NOTE: CSC_LINK and APPLE_API_KEY must hold the *base64 of the files*, not the
# local paths from .env.signing — those paths do not exist on the runner.
#
# Until those secrets exist this workflow will fail, which is the intended
# behaviour: releasing an unsigned desktop app is worse than not releasing one.
# ---------------------------------------------------------------------------

on:
  push:
    tags:
      - "desktop-electron-v*.*.*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # create the GitHub Release and upload assets

jobs:
  # Release gate (R1 of the hub's release-gated-verification; docs/adr/0003-desktop-ci-pipelines.md):
  # the same `bun run verify` the Lefthook pre-push runs, on the exact SHA being released,
  # in a clean Linux environment. Nothing on the macOS runner (~10x the price of Linux)
  # starts until it passes, so a red gate signs and publishes nothing. If it fails after
  # the tag exists, fix forward and cut a patch release; do not move tags.
  verify:
    name: Verify (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check the tag matches the app version
        # A `desktop-electron-v0.2.0` tag must not ship 0.1.0 artifacts and update metadata.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APP_VERSION="$(node -p "require('./apps/desktop-electron/package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#desktop-electron-v}"
          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match apps/desktop-electron/package.json version $APP_VERSION"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      # Restores main's entries (a tag can read main's caches). Keyed on inputs, never on
      # github.sha, so it never mints a per-release entry.
      - name: Cache bun dependencies
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache turbo outputs
        uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

  release-mac:
    name: Build, sign & notarize (macOS)
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 60
    environment: production # the signing secrets live in this Environment
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      # No cache here on purpose: a tag-scoped cache is readable by no later run, and
      # main never runs on macOS, so there is nothing to restore and nothing worth saving.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun install` runs no lifecycle scripts, so the Electron binary is fetched here,
      # explicitly — the only paths that need it are dev, packaging and this release.
      - name: Install the Electron binary
        working-directory: apps/desktop-electron
        run: bun run electron:install

      - name: Prepare Apple API key file
        # @electron/notarize wants the .p8 as a file path, so materialize it into
        # the runner's temp dir and expose that path to later steps. Accepts either
        # the raw .p8 contents or its base64, whichever the secret holds.
        env:
          APPLE_API_KEY_SECRET: ${{ secrets.APPLE_API_KEY }}
        run: |
          KEY_PATH="$RUNNER_TEMP/apple_api_key.p8"
          if printf '%s' "$APPLE_API_KEY_SECRET" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s' "$APPLE_API_KEY_SECRET" > "$KEY_PATH"
          else
            printf '%s' "$APPLE_API_KEY_SECRET" | base64 --decode > "$KEY_PATH"
          fi
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build, sign & notarize
        working-directory: apps/desktop-electron
        env:
          # electron-builder reads these straight from the environment. CSC_LINK
          # accepts a base64-encoded .p12; APPLE_API_KEY (a path) comes from GITHUB_ENV.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          bun run build
          bunx electron-builder --mac --arm64 --x64 --publish never

      - name: Publish update feed + installers to the update bucket
        # Inert until you set the repository variable PUBLISH_UPDATES to "true"
        # and add the R2 secrets — a fresh clone of this template has no bucket,
        # and a missing bucket should not fail an otherwise good release.
        #
        # R2's S3 API needs its own Access Key + Secret (R2 -> Manage R2 API
        # Tokens); a Cloudflare API token does NOT work here.
        if: ${{ startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_UPDATES == 'true' }}
        working-directory: apps/desktop-electron
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The bucket name is not sensitive — keep it a plain variable.
          R2_BUCKET: ${{ vars.R2_UPDATES_BUCKET }}
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # Derive the version from package.json — the same source electron-builder
          # names the DMG from — so a tag/package drift can never point at a file
          # that does not exist.
          VERSION="$(node -p "require('./package.json').version")"
          # Update feed (zip + blockmap + latest-mac.yml) -> updates/
          aws s3 cp dist/ "s3://${R2_BUCKET}/updates/" --recursive \
            --exclude "*" --include "*-mac.zip" --include "*-mac.zip.blockmap" --include "latest-mac.yml" \
            --endpoint-url "$ENDPOINT"
          # Installers -> download/<version>/ and download/latest/
          for arch in arm64 x64; do
            SRC="dist/desktop-electron-${VERSION}-${arch}.dmg"
            aws s3 cp "$SRC" "s3://${R2_BUCKET}/download/${VERSION}/desktop-${arch}.dmg" --endpoint-url "$ENDPOINT"
            aws s3 cp "$SRC" "s3://${R2_BUCKET}/download/latest/desktop-${arch}.dmg" --endpoint-url "$ENDPOINT"
          done

      - name: Prune old release artifacts (keep the last N versions)
        # download/<version>/ and updates/ would otherwise grow one entry per
        # release forever — only download/latest/ overwrites itself. Auto-update
        # only ever needs the newest feed entry; older ones exist for manual
        # rollback, so a handful is enough.
        if: ${{ startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_UPDATES == 'true' }}
        working-directory: apps/desktop-electron
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_UPDATES_BUCKET }}
          KEEP_VERSIONS: 3
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # Version folders under download/ (download/latest/ is not a version), oldest first.
          VERSIONS=$(aws s3 ls "s3://${R2_BUCKET}/download/" --endpoint-url "$ENDPOINT" \
            | awk '{print $2}' | sed 's#/$##' | grep -v '^latest$' | grep -v '^$' | sort -V || true)
          TOTAL=0
          if [ -n "$VERSIONS" ]; then
            TOTAL=$(echo "$VERSIONS" | wc -l | tr -d ' ')
          fi
          STALE=$((TOTAL - KEEP_VERSIONS))
          if [ "$STALE" -gt 0 ]; then
            echo "$VERSIONS" | head -n "$STALE" | while read -r v; do
              [ -z "$v" ] && continue
              echo "Pruning release artifacts for v${v} (keeping the last ${KEEP_VERSIONS})"
              aws s3 rm "s3://${R2_BUCKET}/download/${v}/" --recursive --endpoint-url "$ENDPOINT"
              # Version-scoped feed files only. latest-mac.yml carries no version
              # segment in its name, so it is never matched here.
              aws s3 rm "s3://${R2_BUCKET}/updates/" --recursive --endpoint-url "$ENDPOINT" \
                --exclude "*" --include "*-${v}-*"
            done
          else
            echo "${TOTAL} version(s) published, nothing to prune (keeping the last ${KEEP_VERSIONS})."
          fi

      - name: Upload build as a workflow artifact
        # Manual-dispatch runs only. A tag release already ships the DMG and zip to
        # the GitHub Release, so a workflow artifact would be a redundant ~200 MB
        # copy counting against the Actions storage quota.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            apps/desktop-electron/dist/*.dmg
            apps/desktop-electron/dist/*.zip
          if-no-files-found: error
          retention-days: 3

      - name: Upload artifacts to the GitHub Release
        # Tag pushes only — a manual dispatch has no tag to release against, so it
        # just exercises the build/sign/notarize path.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Draft, so a human writes the notes before it reaches testers.
          # Flip to `draft: false` once the pipeline is trusted.
          draft: true
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            apps/desktop-electron/dist/*.dmg
            apps/desktop-electron/dist/*.zip
            apps/desktop-electron/dist/*.blockmap
            apps/desktop-electron/dist/latest-mac*.yml

# ---------------------------------------------------------------------------
