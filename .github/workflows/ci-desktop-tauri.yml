name: Desktop CI (Tauri)

# The Tauri app's own checks, path-filtered so they only run when the app or a
# shared package changes. Lint and formatting for the TypeScript side live in the
# universal PR Validation workflow; this one adds the Rust side.

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/desktop-tauri/**"
      - "packages/**"
      - "bun.lock"
      - ".github/workflows/ci-desktop-tauri.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint & check bindings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # WebKitGTK and friends: Tauri links against the system webview even to
      # compile tests. https://v2.tauri.app/start/prerequisites/#linux
      - name: Install Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri/src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `build` type-checks, then builds the renderer into dist/ — which the Rust
      # build embeds, so it has to exist first.
      - name: Build renderer
        working-directory: apps/desktop-tauri
        run: bun run build

      - name: Test renderer
        working-directory: apps/desktop-tauri
        run: bun run test

      - name: Check Rust formatting
        working-directory: apps/desktop-tauri/src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: apps/desktop-tauri/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # The Rust suite includes `export_bindings`, which rewrites src/bindings.ts.
      - name: Test Rust core
        working-directory: apps/desktop-tauri
        run: bun run test:rust

      - name: Check the committed bindings are current
        run: |
          if ! git diff --exit-code -- apps/desktop-tauri/src/bindings.ts; then
            echo "::error::src/bindings.ts is stale. Run 'bun run bindings' in apps/desktop-tauri and commit the result."
            exit 1
          fi
