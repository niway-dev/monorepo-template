name: Desktop CI (Tauri)

# Tier: candidate on demand (docs/adr/0003-desktop-ci-pipelines.md).
#
# Not triggered by pull requests. The Lefthook pre-push runs `bun run verify` (~3 s warm)
# and, when the push touches the Rust core or the i18n catalogs, `verify:rust` (~7 s
# warm). release-desktop-tauri.yml runs both on the tagged SHA before anything is signed
# or published. Run this from the Actions tab to rehearse a release on Linux — the one
# platform the owner's machine does not cover, which is how a macOS-only import once
# reached main (PR #25).
#
# Cost: one Linux job. A cold Rust build is several minutes, so the Rust cache matters.
# It is SAVED only when this runs on main and RESTORED everywhere else: a branch or a tag
# can read main's caches, but nothing can read a branch's or a tag's. So dispatching on a
# branch never mints a multi-hundred-MB entry, and after a Cargo.lock change one dispatch
# on main warms the cache that the release gate then restores.
#
# Reopen (back to pull_request, path-filtered to apps/desktop-tauri/**) when a second
# person merges to main, or when a release gate catches something the pre-push missed.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (TypeScript + Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # WebKitGTK and friends: Tauri links against the system webview even to
      # compile tests. https://v2.tauri.app/start/prerequisites/#linux
      - name: Install Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build (restore; saved from main only)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The renderer: type-check, Vite build, Vitest. The Rust build embeds dist/.
      - name: Build renderer
        working-directory: apps/desktop-tauri
        run: bun run build

      - name: Test renderer
        working-directory: apps/desktop-tauri
        run: bun run test

      # fmt, clippy -D warnings, cargo test, and the stale-bindings check — the same
      # script the pre-push and the release gate run.
      - name: Verify Rust core
        working-directory: apps/desktop-tauri
        run: bun run verify:rust
