name: PR Integration Tests

# Tier: on demand only (docs/adr/0003-desktop-ci-pipelines.md; hub:
# monorepos/release-gated-verification.md). Not triggered by pull requests: with a single
# owner and no branch protection a PR check is advisory — it bills every push and verifies
# nothing the Lefthook pre-push (`bun run verify`: lint, format, package builds, types,
# tests) has not already verified for free. Release workflows run the same `verify` on the
# tagged SHA before publishing. Dispatch this from the Actions tab after a risky change
# (lockfile, workflows, scripts/, build config) to rehearse it in a clean environment.
#
# Reopen (back to pull_request) when a second person merges to main, or branch protection
# makes the check required — then it is a guarantee instead of a notification.

# API integration tests run against a REAL Neon branch, so they need a secret.
# This job is opt-in: it stays skipped until you set the repository variable
# RUN_INTEGRATION_TESTS=true and add the TEST_DATABASE_URL secret (see below).
# Until then the rest of CI (PR Validation, Customizer Test) is unaffected.
#
# Setup:
#   1. Create a permanent Neon test branch.
#   2. Repo → Settings → Environments → "testing" → add secret
#      TEST_DATABASE_URL (the branch's POOLED connection string).
#   3. Repo → Settings → Variables → add RUN_INTEGRATION_TESTS = true.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: API integration (Neon)
    if: ${{ vars.RUN_INTEGRATION_TESTS == 'true' }}
    runs-on: ubuntu-latest
    environment: testing
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      BETTER_AUTH_SECRET: ci-integration-secret
      CORS_ORIGIN: http://localhost:3000
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Push schema to the test branch
        run: bun run --cwd packages/infra-db db:push

      - name: Run API integration tests
        run: bun run test:integration:ci
